<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 140" width="560" height="280">
<style>.prog{fill:#7c3aed;animation:p 4s ease-in-out infinite}.n{fill:#fff;stroke:#7c3aed;stroke-width:5}.done{fill:#7c3aed}@keyframes p{0%{width:0}75%,100%{width:210px}}</style>
<rect width="280" height="140" rx="20" fill="#fff"/>
<rect x="35" y="66" width="210" height="8" rx="4" fill="#e5e7eb"/>
<rect class="prog" x="35" y="66" width="0" height="8" rx="4"/>
<circle class="n done" cx="35" cy="70" r="12"/><circle class="n" cx="105" cy="70" r="12"/><circle class="n" cx="175" cy="70" r="12"/><circle class="n" cx="245" cy="70" r="12"/>
<circle cx="105" cy="70" r="5" fill="#7c3aed"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.3;.55;1" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="175" cy="70" r="5" fill="#7c3aed"><animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.45;.7;1" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="245" cy="70" r="5" fill="#7c3aed"><animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.65;.85;1" dur="4s" repeatCount="indefinite"/></circle>
</svg>