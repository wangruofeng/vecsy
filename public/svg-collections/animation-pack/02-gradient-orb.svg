<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 140" width="360" height="280">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#7c3aed"><animate attributeName="stop-color" values="#7c3aed;#ec4899;#06b6d4;#7c3aed" dur="5s" repeatCount="indefinite"/></stop>
<stop offset="1" stop-color="#22c55e"><animate attributeName="stop-color" values="#22c55e;#f59e0b;#8b5cf6;#22c55e" dur="5s" repeatCount="indefinite"/></stop>
</linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<style>.orb{transform-origin:90px 70px;animation:p 3s ease-in-out infinite}@keyframes p{0%,100%{transform:scale(.9)}50%{transform:scale(1.08)}}</style>
<rect width="180" height="140" rx="20" fill="#0f172a"/>
<circle cx="90" cy="70" r="42" fill="url(#g)" opacity=".45" filter="url(#blur)"/>
<circle class="orb" cx="90" cy="70" r="36" fill="url(#g)"/>
</svg>