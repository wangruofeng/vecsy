<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 150" width="440" height="300">
<style>
.cloud{animation:c 2.4s ease-in-out infinite}
.r1,.r2,.r3,.r4{stroke:#3b82f6;stroke-width:5;stroke-linecap:round;animation:r 1.2s linear infinite}
.r2{animation-delay:-.3s}.r3{animation-delay:-.6s}.r4{animation-delay:-.9s}
@keyframes c{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes r{0%{transform:translateY(-5px);opacity:0}20%{opacity:1}100%{transform:translateY(35px);opacity:0}}
</style>
<rect width="220" height="150" rx="20" fill="#fff"/>
<g class="cloud">
  <ellipse cx="110" cy="62" rx="52" ry="26" fill="#dbeafe"/>
  <circle cx="82" cy="55" r="24" fill="#dbeafe"/>
  <circle cx="122" cy="46" r="31" fill="#dbeafe"/>
  <circle cx="151" cy="61" r="22" fill="#dbeafe"/>
</g>
<line class="r1" x1="70" y1="88" x2="62" y2="105"/>
<line class="r2" x1="105" y1="88" x2="97" y2="105"/>
<line class="r3" x1="140" y1="88" x2="132" y2="105"/>
<line class="r4" x1="165" y1="88" x2="157" y2="105"/>
</svg>