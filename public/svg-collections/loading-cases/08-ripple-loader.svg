<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="240" height="240">
<style>
.w{fill:none;stroke:#7c3aed;stroke-width:4;transform-origin:60px 60px;animation:r 1.8s ease-out infinite}
.w2{animation-delay:-.6s}.w3{animation-delay:-1.2s}
@keyframes r{0%{transform:scale(.2);opacity:.95}100%{transform:scale(1);opacity:0}}
</style>
<rect width="120" height="120" rx="24" fill="#fff"/>
<circle class="w" cx="60" cy="60" r="36"/>
<circle class="w w2" cx="60" cy="60" r="36"/>
<circle class="w w3" cx="60" cy="60" r="36"/>
<circle cx="60" cy="60" r="8" fill="#7c3aed"/>
</svg>