<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" width="640" height="380">
  <style>
    .p{fill:#7c3aed;transform-box:fill-box;transform-origin:center;animation:float 3s ease-in-out infinite}
    .p2{animation-delay:-.7s;animation-duration:3.8s}.p3{animation-delay:-1.8s;animation-duration:2.7s}.p4{animation-delay:-2.3s;animation-duration:4.2s}.p5{animation-delay:-1.1s;animation-duration:3.3s}
    @keyframes float{0%{transform:translateY(22px) scale(.45);opacity:0}35%{opacity:.9}100%{transform:translateY(-45px) scale(1.2);opacity:0}}
  </style>
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="320" height="190" fill="#fff"/>
  <circle cx="160" cy="116" r="37" fill="#7c3aed" opacity=".88" filter="url(#glow)"/>
  <circle cx="160" cy="116" r="16" fill="#fff" opacity=".9"/>
  <circle class="p" cx="105" cy="83" r="7" filter="url(#glow)"/>
  <circle class="p p2" cx="137" cy="67" r="5" filter="url(#glow)"/>
  <circle class="p p3" cx="185" cy="73" r="8" filter="url(#glow)"/>
  <circle class="p p4" cx="219" cy="91" r="6" filter="url(#glow)"/>
  <circle class="p p5" cx="168" cy="46" r="4" filter="url(#glow)"/>
</svg>