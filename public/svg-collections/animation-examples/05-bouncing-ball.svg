<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" width="640" height="380">
  <style>
    .ball{transform-box:fill-box;transform-origin:center bottom;animation:jump 1.35s cubic-bezier(.45,.04,.55,.95) infinite}
    .shadow{transform-box:fill-box;transform-origin:center;animation:shadow 1.35s ease-in-out infinite}
    @keyframes jump{0%,100%{transform:translateY(0) scaleX(1.2) scaleY(.82)}12%{transform:translateY(-9px) scaleX(.96) scaleY(1.05)}50%{transform:translateY(-82px)}88%{transform:translateY(-9px) scaleX(.96) scaleY(1.05)}}
    @keyframes shadow{0%,100%{transform:scaleX(1);opacity:.2}50%{transform:scaleX(.38);opacity:.06}}
  </style>
  <rect width="320" height="190" fill="#fff"/>
  <line x1="66" y1="153" x2="254" y2="153" stroke="#d1d5db" stroke-width="5" stroke-linecap="round"/>
  <ellipse class="shadow" cx="160" cy="154" rx="37" ry="8" fill="#111827" opacity=".18"/>
  <g class="ball">
    <circle cx="160" cy="120" r="28" fill="#7c3aed"/>
    <ellipse cx="150" cy="109" rx="8" ry="6" fill="#fff" opacity=".72"/>
  </g>
</svg>